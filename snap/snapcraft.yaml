name: shoppinglist
version: 1.3.0
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-shoppinglist: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.shoppinglist # adjust accordingly to your app name

apps:
  shoppinglist:
    command: shoppinglist
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-shoppinglist
parts:
  shoppinglist:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
